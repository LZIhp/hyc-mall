# 华耀城商城 Nginx 配置
# 监听 8000 端口（未备案时 80 端口被云厂商拦截，用 8000）

server {
    listen 8000;
    server_name _;

    # 前端静态文件（用户端构建产物）
    root /opt/hyc-mall/frontend/apps/user/dist;
    index index.html;

    # 后端 API 反向代理到 gunicorn(8001)
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Django admin
    location /admin/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 媒体文件（图片上传）
    location /media/ {
        proxy_pass http://127.0.0.1:8001;
    }

    # 前端 SPA 路由（history 模式回退到 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
